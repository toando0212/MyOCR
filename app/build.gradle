plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.myocr'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.myocr"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okio:okio:2.10.0'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation 'com.github.yalantis:ucrop:2.2.10'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation 'com.itextpdf:itextg:5.5.10'
    implementation 'org.apache.poi:poi-ooxml:5.2.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.3'
    implementation project(':sdk')
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation 'com.github.haifengl:smile-core:3.0.1'
    implementation 'org.bytedeco:javacpp:1.5.11'
    implementation 'org.bytedeco:openblas:0.3.28-1.5.11:android-arm64'
    implementation 'org.bytedeco:openblas:0.3.28-1.5.11:android-x86_64'
}